<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030504">
  <meta name="description" content="A free market tool with AI analysis and 25+ indicators.">
  <title>Free Market Tool</title>
  <link rel="preload" href="creative-a.jpg?v=3" as="image" type="image/jpeg">
  <style>
    :root {
      color-scheme: dark;
      --green: #31ef88;
      --text: #ffffff;
      --muted: #9ba7a0;
      --background: #030504;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-width: 320px;
      background: var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100svh;
    }

    .feed {
      width: 100%;
      max-width: 560px;
      min-height: 100svh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--background);
    }

    .image-link {
      display: block;
      width: 100%;
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .creative {
      display: block;
      width: 100%;
      height: auto;
    }

    .content {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: clamp(1.5rem, 5vw, 3rem) 1.25rem max(1.75rem, env(safe-area-inset-bottom));
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 3.4rem);
      line-height: 1.02;
      letter-spacing: -.045em;
    }

    .intro {
      margin: .85rem auto 0;
      color: #d7ded9;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.5;
    }

    .disclaimer {
      margin: 1.2rem auto 0;
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.45;
    }

    .image-link:focus-visible {
      outline: 3px solid var(--green);
      outline-offset: -3px;
    }

    @media (min-width: 700px) {
      body {
        padding: 32px 0;
        background: #010201;
      }

      .feed {
        min-height: 0;
        border: 1px solid rgba(49, 239, 136, .14);
        border-radius: 18px;
        box-shadow: 0 28px 90px rgba(0, 0, 0, .65);
      }
    }
  </style>
</head>
<body>
  <main class="feed">
    <a class="image-link destination" href="#" aria-label="Test the free market tool">
      <img class="creative" src="creative-a.jpg?v=3" width="941" height="1672" fetchpriority="high" alt="Free market tool with AI analysis and 25+ indicators">
    </a>

    <section class="content" aria-labelledby="pageTitle">
      <h1 id="pageTitle">AI analysis. 25+ indicators.</h1>
      <p class="intro">Tap the preview to test the free market tool.</p>
      <p class="disclaimer">Educational use only. Trading involves risk. Results are not guaranteed.</p>
    </section>
  </main>

  <script src="config.js"></script>
  <script>
    (() => {
      const destinationUrl = window.LANDING_CONFIG?.destinationUrl;
      const link = document.querySelector(".destination");

      if (destinationUrl && !destinationUrl.includes("REPLACE_ME")) {
        link.href = destinationUrl;
        link.rel = "noopener noreferrer";
      } else {
        link.addEventListener("click", (event) => event.preventDefault());
      }
    })();
  </script>
</body>
</html>
