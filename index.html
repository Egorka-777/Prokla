<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0704">
  <meta name="description" content="A free market tool with AI analysis and 25+ indicators.">
  <title>Free Market Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" href="creative-c.jpg?v=2" as="image" type="image/jpeg" fetchpriority="high">
  <style>
    :root {
      color-scheme: dark;
      --amber-2: #ffb020;
      --amber-3: #ff8a1f;
      --green-1: #8bffb8;
      --green-2: #22e07a;
      --green-3: #0aa858;
      --ink: #050403;
      --cream: #f7f1e6;
      --muted: #b7ab98;
      --line: rgba(255, 191, 110, .16);
      --panel: #120d08;
      --panel-2: #17110a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 320px;
    }

    body {
      min-height: 100svh;
      background: var(--ink);
      color: var(--cream);
      font-family: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      position: relative;
      overflow-x: hidden;
    }

    /* ---------- premium ambient backdrop ---------- */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(620px 460px at 82% 8%, rgba(255, 158, 46, .16), transparent 60%),
        radial-gradient(520px 520px at 6% 88%, rgba(255, 122, 26, .10), transparent 62%),
        radial-gradient(1200px 800px at 50% -10%, #1a130a, transparent 55%),
        linear-gradient(180deg, #0d0906 0%, #08050380 40%, #050403 100%);
      pointer-events: none;
    }

    .backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .05;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    .glow {
      position: fixed;
      z-index: 0;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
    }

    .glow--a {
      width: 420px;
      height: 420px;
      right: -140px;
      top: -120px;
      background: radial-gradient(circle, rgba(255, 176, 32, .30), transparent 70%);
    }

    .glow--b {
      width: 360px;
      height: 360px;
      left: -120px;
      bottom: -100px;
      background: radial-gradient(circle, rgba(255, 122, 26, .18), transparent 70%);
    }

    /* ---------- card ---------- */
    .stage {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: clamp(14px, 4vw, 48px) clamp(14px, 4vw, 24px);
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 440px;
      border-radius: 22px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, .04) inset,
        0 30px 70px -20px rgba(0, 0, 0, .75),
        0 0 0 1px rgba(0, 0, 0, .4);
    }

    .image-link {
      display: block;
      position: relative;
      width: 100%;
      line-height: 0;
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .creative {
      display: block;
      width: 100%;
      height: auto;
    }

    .tap-cover {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .panel {
      position: relative;
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      padding: clamp(20px, 5vw, 30px) clamp(20px, 5.5vw, 30px) clamp(22px, 5vw, 28px);
      text-align: center;
      border-top: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-family: "Sora", "Inter", sans-serif;
      font-weight: 700;
      font-size: clamp(1.28rem, 3.6vw, 1.55rem);
      line-height: 1.18;
      letter-spacing: -.01em;
      color: var(--cream);
    }

    .intro {
      margin: .6rem auto 0;
      max-width: 34ch;
      color: var(--muted);
      font-size: clamp(.92rem, 2vw, 1rem);
      line-height: 1.5;
    }

    .cta-onimage {
      position: absolute;
      left: 50%;
      bottom: 3.6%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      white-space: nowrap;
      width: 94%;
      padding: clamp(1.18rem, 4.4vw, 1.48rem) clamp(1.25rem, 4.8vw, 1.7rem);
      border-radius: 999px;
      background: linear-gradient(135deg, var(--green-1), var(--green-2) 55%, var(--green-3));
      color: #062713;
      font-family: "Sora", "Inter", sans-serif;
      font-weight: 700;
      font-size: clamp(1.18rem, 4.9vw, 1.48rem);
      letter-spacing: -.01em;
      text-decoration: none;
      box-shadow:
        0 14px 30px -8px rgba(0, 0, 0, .65),
        0 10px 22px -6px rgba(34, 224, 122, .55),
        0 2px 0 rgba(255, 255, 255, .4) inset;
      isolation: isolate;
      animation: pulse-scale 2.6s ease-in-out infinite;
    }

    .cta-onimage::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      z-index: -1;
      background: linear-gradient(135deg, var(--green-1), var(--green-3));
      animation: pulse-ring 2.6s ease-out infinite;
    }

    .cta-onimage .arrow {
      margin-left: .05rem;
      transition: transform .25s ease;
    }

    .cta-onimage:hover .arrow { transform: translateX(3px); }

    @keyframes pulse-scale {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.028); }
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(34, 224, 122, .55); opacity: 1; }
      70% { box-shadow: 0 0 0 16px rgba(34, 224, 122, 0); opacity: 0; }
      100% { box-shadow: 0 0 0 0 rgba(34, 224, 122, 0); opacity: 0; }
    }

    .disclaimer {
      margin: .95rem auto 0;
      color: #7d7364;
      font-size: .74rem;
      line-height: 1.5;
      max-width: 38ch;
      margin-left: auto;
      margin-right: auto;
    }

    .image-link:focus-visible,
    .tap-cover:focus-visible,
    .cta-onimage:focus-visible {
      outline: 2px solid var(--green-2);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .cta-onimage, .cta-onimage::before { animation: none; }
    }

    /* ---------- desktop refinement ---------- */
    @media (min-width: 720px) {
      .stage { padding: 56px 24px; }

      .card {
        max-width: 460px;
        border-radius: 26px;
      }

      .panel { padding: 32px 34px 32px; }

      h1 { font-size: 1.6rem; }
    }

    @media (min-height: 760px) and (min-width: 720px) {
      .stage { padding-top: 8vh; padding-bottom: 8vh; }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="glow glow--a" aria-hidden="true"></div>
  <div class="glow glow--b" aria-hidden="true"></div>

  <main class="stage">
    <div class="card">
      <div class="image-link">
        <img class="creative" src="creative-c.jpg?v=2" width="941" height="1672" fetchpriority="high" alt="Free AI market tool showing a live EUR/USD chart with 25+ indicators">
        <a class="tap-cover destination" href="#" aria-label="Test the free market tool"></a>
        <a class="cta-onimage destination" href="#">
          <span>Get free access</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>

      <section class="panel" aria-labelledby="pageTitle">
        <h1 id="pageTitle">See what the AI sees.</h1>
        <p class="intro">Real-time signals, free to try.</p>
        <p class="disclaimer">Educational use only. Trading involves risk. Results are not guaranteed.</p>
      </section>
    </div>
  </main>

  <script src="config.js"></script>
  <script>
    (() => {
      const destinationUrl = window.LANDING_CONFIG?.destinationUrl;
      const links = document.querySelectorAll(".destination");

      links.forEach((link) => {
        if (destinationUrl && !destinationUrl.includes("REPLACE_ME")) {
          link.href = destinationUrl;
          link.rel = "noopener noreferrer";
        } else {
          link.addEventListener("click", (event) => event.preventDefault());
        }
      });
    })();
  </script>
</body>
</html>
