<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0704">
  <meta name="description" content="A free market tool with AI analysis and 25+ indicators.">
  <title>Free Market Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --green-1: #8bffb8;
      --green-2: #22e07a;
      --green-3: #0aa858;
      --ink: #050403;
      --cream: #f7f1e6;
      --muted: #b7ab98;
      --line: rgba(255, 191, 110, .16);
      --panel: #120d08;
      --panel-2: #17110a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 320px;
    }

    body {
      min-height: 100svh;
      background:
        radial-gradient(620px 460px at 82% 8%, rgba(255, 158, 46, .16), transparent 60%),
        radial-gradient(520px 520px at 6% 88%, rgba(255, 122, 26, .10), transparent 62%),
        linear-gradient(180deg, #0d0906 0%, #080503 45%, #050403 100%);
      color: var(--cream);
      font-family: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .stage {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: clamp(14px, 4vw, 48px) clamp(14px, 4vw, 24px);
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 460px;
      border-radius: 26px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .75);
    }

    .image-wrap {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .creative {
      display: block;
      width: 100%;
      height: auto;
    }

    .tap-cover {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .cta-onimage {
      position: absolute;
      left: 50%;
      bottom: 3.5%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      width: 94%;
      min-height: 66px;
      padding: clamp(1.18rem, 4.4vw, 1.5rem) clamp(1.25rem, 4.8vw, 1.8rem);
      border-radius: 999px;
      background: linear-gradient(135deg, var(--green-1), var(--green-2) 55%, var(--green-3));
      color: #062713;
      font-family: "Sora", "Inter", sans-serif;
      font-weight: 800;
      font-size: clamp(1.18rem, 4.9vw, 1.5rem);
      letter-spacing: -.02em;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      box-shadow:
        0 14px 30px -8px rgba(0, 0, 0, .65),
        0 10px 22px -6px rgba(34, 224, 122, .55),
        0 2px 0 rgba(255, 255, 255, .4) inset;
      animation: pulse 2.6s ease-in-out infinite;
    }

    .cta-onimage .arrow {
      transition: transform .25s ease;
    }

    .cta-onimage:hover .arrow {
      transform: translateX(4px);
    }

    @keyframes pulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.025); }
    }

    .panel {
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      padding: 30px 28px;
      text-align: center;
      border-top: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-family: "Sora", "Inter", sans-serif;
      font-weight: 700;
      font-size: clamp(1.28rem, 3.6vw, 1.6rem);
      line-height: 1.18;
      color: var(--cream);
    }

    .intro {
      margin: .6rem auto 0;
      color: var(--muted);
      font-size: clamp(.92rem, 2vw, 1rem);
      line-height: 1.5;
    }

    .disclaimer {
      margin: .95rem auto 0;
      color: #7d7364;
      font-size: .74rem;
      line-height: 1.5;
      max-width: 38ch;
    }

    .tap-cover:focus-visible,
    .cta-onimage:focus-visible {
      outline: 2px solid var(--green-2);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .cta-onimage { animation: none; }
    }

    @media (max-width: 719px) {
      .stage { padding: 0; }
      .card {
        max-width: 100%;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="card">
      <div class="image-wrap">
        <img class="creative" src="./creative.jpg" width="941" height="1672" fetchpriority="high" decoding="async" alt="Free AI market tool showing a live EUR/USD chart with 25+ indicators">
        <a class="tap-cover destination" href="#" aria-label="Open free market tool"></a>
        <a class="cta-onimage destination" href="#">
          <span>Get free access</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>

      <section class="panel" aria-labelledby="pageTitle">
        <h1 id="pageTitle">See what the AI sees.</h1>
        <p class="intro">Real-time signals, free to try.</p>
        <p class="disclaimer">Educational use only. Trading involves risk. Results are not guaranteed.</p>
      </section>
    </div>
  </main>

  <script src="./config.js"></script>
  <script>
    (() => {
      const destinationUrl = window.LANDING_CONFIG?.destinationUrl;
      document.querySelectorAll(".destination").forEach((link) => {
        if (destinationUrl && !destinationUrl.includes("REPLACE_ME")) {
          link.href = destinationUrl;
          link.rel = "noopener noreferrer";
        } else {
          link.addEventListener("click", (event) => event.preventDefault());
        }
      });
    })();
  </script>
</body>
</html>
