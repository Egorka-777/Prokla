<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050806">
  <meta name="description" content="Market analysis, chart reviews and trader community discussion.">
  <title>Market Desk — Trader Community</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307110b'/%3E%3Cpath d='M12 43l12-13 9 7 19-21' fill='none' stroke='%233df47d' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="creative-a.jpg" as="image" type="image/jpeg">
  <style>
    :root {
      color-scheme: dark;
      --green: #36ed76;
      --surface: #0a0e0b;
      --muted: #aab4ad;
    }

    * { box-sizing: border-box; }

    html { background: #030504; }

    body {
      margin: 0;
      min-width: 320px;
      background: #030504;
      color: #fff;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100svh;
      display: grid;
      place-items: center;
    }

    .layout {
      width: min(100%, 1120px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 420px);
      align-items: center;
      gap: clamp(2rem, 6vw, 5rem);
      padding: 28px;
    }

    .image-link {
      display: block;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
      color: inherit;
      text-decoration: none;
      border-radius: 22px;
      overflow: hidden;
      background: #080b09;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .48);
      -webkit-tap-highlight-color: transparent;
    }

    .creative {
      display: block;
      width: auto;
      max-width: 100%;
      height: min(88svh, 900px);
      object-fit: contain;
    }

    .content { max-width: 390px; }

    .label {
      margin: 0 0 1rem;
      color: var(--green);
      font-size: .78rem;
      line-height: 1.3;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 11ch;
      font-size: clamp(2.35rem, 5vw, 4.7rem);
      line-height: .98;
      letter-spacing: -.055em;
    }

    .intro {
      margin: 1.35rem 0 1.7rem;
      color: #d6ddd8;
      font-size: 1.05rem;
      line-height: 1.55;
    }

    .button {
      display: inline-flex;
      min-height: 56px;
      align-items: center;
      justify-content: center;
      gap: .65rem;
      padding: 0 1.4rem;
      border-radius: 12px;
      background: var(--green);
      color: #021006;
      font-size: 1rem;
      font-weight: 900;
      text-decoration: none;
    }

    .button::after { content: "↗"; }

    .disclaimer {
      margin: 1rem 0 0;
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.45;
    }

    .image-link:focus-visible,
    .button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .setup-note {
      display: none;
      position: fixed;
      z-index: 5;
      inset: auto 1rem max(1rem, env(safe-area-inset-bottom));
      max-width: 34rem;
      margin: auto;
      padding: 1rem;
      border: 1px solid rgba(54, 237, 118, .6);
      border-radius: 14px;
      background: #08130d;
      box-shadow: 0 12px 40px #000;
      font-size: .95rem;
      line-height: 1.4;
      text-align: center;
    }

    .setup-note.is-visible { display: block; }

    @media (max-width: 760px) {
      .page { display: block; }

      .layout {
        display: flex;
        width: 100%;
        flex-direction: column;
        gap: 0;
        padding: 0;
      }

      .image-link {
        width: 100%;
        border-radius: 0;
        box-shadow: none;
      }

      .creative {
        width: 100%;
        height: auto;
      }

      .content {
        width: 100%;
        max-width: none;
        padding: 1.6rem 1.25rem max(1.6rem, env(safe-area-inset-bottom));
        background: var(--surface);
      }

      h1 {
        max-width: 14ch;
        font-size: clamp(2rem, 10vw, 3rem);
      }

      .intro { margin: 1rem 0 1.25rem; }
      .button { width: 100%; }
    }

    @media (min-width: 761px) and (max-height: 720px) {
      .creative { height: calc(100svh - 40px); }
      .layout { padding-block: 20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="layout">
      <a class="image-link destination" href="#" aria-label="Open the trader community">
        <img class="creative" src="creative-a.jpg" width="941" height="1672" fetchpriority="high" alt="Trader reviewing a market chart">
      </a>

      <section class="content" aria-labelledby="pageTitle">
        <p class="label">Market analysis · Trader community</p>
        <h1 id="pageTitle">See the market clearly.</h1>
        <p class="intro">Chart reviews, trading ideas and focused community discussion.</p>
        <a class="button destination" href="#">Open Telegram</a>
        <p class="disclaimer">Educational content only. Trading involves risk. Results are not guaranteed.</p>
      </section>
    </div>
  </main>

  <div class="setup-note" id="setupNote" role="status">
    Add your final community link in <strong>config.js</strong> before publishing.
  </div>

  <script src="config.js"></script>
  <script>
    (() => {
      const config = window.LANDING_CONFIG || {};
      const destinationLinks = document.querySelectorAll(".destination");
      const setupNote = document.getElementById("setupNote");

      if (config.destinationUrl && !config.destinationUrl.includes("REPLACE_ME")) {
        destinationLinks.forEach((link) => {
          link.href = config.destinationUrl;
          link.rel = "noopener noreferrer";
        });
      } else {
        destinationLinks.forEach((link) => {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            setupNote.classList.add("is-visible");
            window.setTimeout(() => setupNote.classList.remove("is-visible"), 4500);
          });
        });
      }
    })();
  </script>
</body>
</html>
